---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}
    </p>
  </header>
  {{ content }}
  <p class="back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
